<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Internship Daily Logbook</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #edf0f4;
  color: #111;
}

.editor {
  max-width: 850px;
  margin: auto;
  padding: 24px;
  background: white;
  border-radius: 10px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 5px;
}

input,
textarea,
select {
  width: 100%;
  padding: 9px;
  border: 1px solid #aaa;
  border-radius: 4px;
  font: inherit;
}

input[readonly] {
  background: #f1f3f5;
  color: #555;
  cursor: not-allowed;
}

textarea {
  min-height: 85px;
  resize: vertical;
  text-align: justify;
}

.row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.entry {
  border: 1px solid #ccc;
  padding: 14px;
  margin: 12px 0;
  border-radius: 6px;
}

button {
  padding: 10px 15px;
  margin: 6px 5px 6px 0;
  border: 0;
  border-radius: 5px;
  background: #2058ae;
  color: white;
  cursor: pointer;
}

button:hover {
  opacity: 0.85;
}

button.danger {
  background: #ad3434;
}

.image-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.image-card {
  width: 130px;
  padding: 7px;
  border: 1px solid #ddd;
  border-radius: 6px;
  text-align: center;
}

.image-card img {
  width: 100%;
  height: 85px;
  object-fit: contain;
}

.image-card button {
  width: 100%;
  padding: 6px;
  font-size: 12px;
}

.image-name {
  font-size: 11px;
  overflow-wrap: anywhere;
}

canvas {
  display: block;
  width: 100%;
  height: 130px;
  border: 1px solid #aaa;
  background: white;
  touch-action: none;
}

#uploadedSignaturePreview {
  display: none;
  max-width: 220px;
  max-height: 100px;
  object-fit: contain;
  margin-top: 10px;
}

.preview {
  width: 210mm;
  max-width: 100%;
  min-height: 297mm;
  margin: 20px auto;
  padding: 12mm;
  background: white;
  box-shadow: 0 2px 12px #bbb;
}

.header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11px;
  font-weight: bold;
}

.instruction {
  font-size: 9px;
  font-style: italic;
  margin: 5px 0 8px;
}

.log-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 11px;
}

.log-table th,
.log-table td {
  border: 1px solid black;
  padding: 7px;
  vertical-align: top;
  overflow-wrap: anywhere;
}

.log-table th {
  height: 25px;
  text-align: center;
}

.log-table th:nth-child(1) {
  width: 17%;
}

.log-table th:nth-child(2) {
  width: 35%;
}

.log-table th:nth-child(3) {
  width: 48%;
}

.log-table td {
  height: 175mm;
  text-align: justify;
  line-height: 1.45;
}

#pEntries,
#pRemarks {
  text-align: justify;
}

.activity-text {
  margin: 0 0 12px;
  white-space: pre-wrap;
  text-align: justify;
}

.remark-block {
  margin-bottom: 14px;
  break-inside: avoid;
}

.remark-block img {
  display: block;
  width: auto;
  max-width: 100%;
  max-height: 110px;
  object-fit: contain;
  margin: 8px auto;
  break-inside: avoid;
}

.signature-area {
  margin-top: 22px;
  font-size: 11px;
}

.signature-area img {
  display: block;
  width: 145px;
  height: 55px;
  object-fit: contain;
  object-position: left bottom;
}

.signature-area img:not([src]) {
  visibility: hidden;
}

.signature-line {
  border-top: 1px solid black;
  width: 160px;
}

[hidden] {
  display: none !important;
}

@page {
  size: A4 portrait;
  margin: 0;
}

@media print {

  body {
    margin: 0;
    padding: 0;
    background: white;
  }

  .editor {
    display: none;
  }

  .preview {
    width: 210mm;
    max-width: none;
    min-height: 297mm;
    margin: 0;
    padding: 12mm;
    box-shadow: none;
  }

  .log-table td {
    height: 175mm;
  }

  .remark-block img {
    max-width: 100%;
    max-height: 110px;
  }
}

@media screen and (max-width: 600px) {

  .row {
    grid-template-columns: 1fr;
  }

  .editor {
    padding: 15px;
  }

  .preview {
    padding: 7mm;
  }

  .header {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<section class="editor">

  <h2>Internship Daily Logbook</h2>

  <div class="row">

    <div>
      <label for="date">Date</label>

      <input
        type="date"
        id="date"
        min="2026-09-28"
        max="2027-03-12"
      >
    </div>

    <div>
      <label for="week">Training Week</label>

      <input
        type="number"
        id="week"
        readonly
        placeholder="Auto calculated"
      >
    </div>

  </div>

  <div class="row">

    <div>
      <label for="start">Start Time</label
