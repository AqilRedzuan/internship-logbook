
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Logbook</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f3f6;
  padding: 20px;
}
.container {
  max-width: 800px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 10px;
}
input, textarea {
  width: 100%;
  padding: 9px;
  margin: 5px 0 12px;
  box-sizing: border-box;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  border: 1px solid #333;
  padding: 8px;
}
td input, td textarea {
  margin: 0;
}
canvas {
  border: 1px solid #888;
  width: 100%;
  height: 130px;
  touch-action: none;
}
button {
  padding: 10px 16px;
  margin: 8px 5px 8px 0;
  cursor: pointer;
}
@media print {
  body { background: white; padding: 0; }
  .container { max-width: none; padding: 0; }
  .controls { display: none; }
  input, textarea { border: none; }
}
</style>
</head>
<body>
<div class="container">
<h2>Internship Daily Logbook</h2>

<label>Date</label>
<input type="date" id="date">

<label>Training Week</label>
<input type="number" id="week" min="1">

<table id="activities">
<thead>
<tr>
<th>Time</th>
<th>Entry</th>
<th>Description / Remarks</th>
</tr>
</thead>
<tbody>
<tr>
<td><input placeholder="9:30 AM"></td>
<td><input placeholder="IT Support"></td>
<td><textarea placeholder="Describe your task"></textarea></td>
</tr>
</tbody>
</table>

<div class="controls">
<button onclick="addRow()">+ Add Entry</button>
</div>

<h3>Student Signature</h3>
<canvas id="signature"></canvas>

<div class="controls">
<button onclick="clearSignature()">Clear Signature</button>
<button onclick="downloadPDF()">Download PDF</button>
</div>
</div>

<script>
const canvas = document.getElementById("signature");
const ctx = canvas.getContext("2d");
let drawing = false;

function resizeCanvas() {
  const saved = canvas.toDataURL();
  canvas.width = canvas.clientWidth;
  canvas.height = 130;
  const img = new Image();
  img.onload = () => ctx.drawImage(img, 0, 0);
  img.src = saved;
}
resizeCanvas();

function position(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * canvas.width / r.width,
    y: (e.clientY - r.top) * canvas.height / r.height
  };
}

canvas.addEventListener("pointerdown", e => {
  drawing = true;
  canvas.setPointerCapture(e.pointerId);
  const p = position(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
});

canvas.addEventListener("pointermove", e => {
  if (!drawing) return;
  const p = position(e);
  ctx.lineTo(p.x, p.y);
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.stroke();
});

canvas.addEventListener("pointerup", () => drawing = false);
canvas.addEventListener("pointercancel", () => drawing = false);

function clearSignature() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function addRow() {
  const tbody = document.querySelector("#activities tbody");
  const row = tbody.insertRow();
  row.innerHTML = `
    <td><input placeholder="Time"></td>
    <td><input placeholder="Entry"></td>
    <td><textarea placeholder="Description"></textarea></td>
  `;
}

function downloadPDF() {
  window.print();
}
</script>
</body>
</html>
